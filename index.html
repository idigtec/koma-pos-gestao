    <script>
      // Compatibility guard: ensure window.fetch can be assigned without throwing if defined as getter-only
      (function() {
        try {
          var originalFetch = window.fetch;
          var boundFetch = originalFetch ? originalFetch.bind(window) : null;
          var currentFetch = boundFetch;

          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch || boundFetch;
            },
            set: function(val) {
              if (typeof val === 'function') {
                currentFetch = val;
              }
            }
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
